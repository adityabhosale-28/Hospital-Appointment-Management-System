<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5);
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: rgba(255,255,255,0.9); padding: 20px; border-radius: 10px;
            width: 400px; color: #333;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <h2>MyClinic</h2>
            <div style="color:var(--text-muted); font-size:0.85rem; padding: 0 16px; margin-bottom: 2rem; font-weight:600;" id="userNameText">Doctor Panel</div>
            <a href="#" onclick="loadTodayApps()" class="active"><i class="fas fa-calendar-day" style="width:20px;"></i> All Appointments</a>
            <a href="#" onclick="api.logout()"><i class="fas fa-sign-out-alt" style="width:20px;"></i> Logout</a>
        </div>
        <div class="main-content">
            <h1 class="mb-2">Doctor Dashboard</h1>

            <div class="table-container">
                <h3>All Patient Appointments</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Token</th><th>Patient</th><th>Age/Gender/Phone</th><th>Date</th><th>Time</th><th>Problem</th><th>Status</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="todayAppsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="actionModal" class="modal">
        <div class="modal-content glass-box" style="background:#fff; width:450px; padding:2.5rem; border-radius:var(--radius-lg); box-shadow:var(--shadow-soft);">
            <h3 id="modalTitle" style="color:var(--text-main); margin-bottom:1.5rem; font-weight:800;"><i class="fas fa-file-medical"></i> Complete Session</h3>
            <form id="actionForm">
                <input type="hidden" id="modalAppId">
                <h4 style="color:var(--primary-color); font-weight:700; margin-bottom:1rem; font-size:1rem;">Prescription Details</h4>
                <div class="form-group" style="margin-bottom:15px;">
                    <label>Diagnosis</label>
                    <input type="text" id="diagnosis" placeholder="Describe diagnosis" required>
                </div>
                <div class="form-group" style="margin-bottom:15px;">
                    <label>Medicine prescribed</label>
                    <input type="text" id="medicine" placeholder="e.g. Amoxicillin" required>
                </div>
                <div class="form-group" style="margin-bottom:20px;">
                    <label>Dosage</label>
                    <input type="text" id="dosage" placeholder="2 times a day" required>
                </div>
                
                <h4 style="color:var(--primary-color); font-weight:700; margin-top:25px; margin-bottom:1rem; font-size:1rem;">Billing Info</h4>
                <div class="form-group">
                    <label>Consultation Fee (Rs.)</label>
                    <input type="number" id="amount" placeholder="0.00" required>
                </div>
                <div style="display:flex; gap:15px; margin-top:30px;">
                    <button type="submit" class="btn" style="flex:1;"><i class="fas fa-save"></i> Save & Complete</button>
                    <button type="button" class="btn" style="background:transparent; color:var(--text-main); border:2px solid var(--border-color); flex:1;" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        api.checkAuth('Doctor');
        const user = api.getUser();
        document.getElementById('userNameText').innerText = `Dr. ${user.name}`;

        async function loadTodayApps() {
            try {
                const res = await api.request('/doctor/appointments/today');
                const tbody = document.getElementById('todayAppsBody');
                tbody.innerHTML = res.appointments.map(a => `
                    <tr>
                        <td><b>${a.Token_No}</b></td>
                        <td>${a.Patient_Name}</td>
                        <td>${a.Age} / ${a.Gender}<br><small>${a.Phone || '-'}</small></td>
                        <td>${a.Date}</td>
                        <td>${a.Time}</td>
                        <td>${a.Problem || '-'}</td>
                        <td><span class="badge ${a.Status.toLowerCase() === 'completed' ? 'badge-completed' : 'badge-pending'}"><i class="fas ${a.Status.toLowerCase() === 'completed' ? 'fa-check' : 'fa-clock'}"></i> ${a.Status}</span></td>
                        <td>
                            ${a.Status !== 'Completed' ? `<button class="btn btn-small" onclick="openModal(${a.Appointment_ID})"><i class="fas fa-clipboard-check"></i> Complete</button>` : `<span style="color:var(--success); font-weight:bold;"><i class="fas fa-check-double"></i> Done</span>`}
                        </td>
                    </tr>
                `).join('');
            } catch(e) {
                alert("Error loading appointments: " + e.message);
            }
        }

        function openModal(appId) {
            document.getElementById('modalAppId').value = appId;
            document.getElementById('actionModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('actionModal').style.display = 'none';
        }

        document.getElementById('actionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const appId = document.getElementById('modalAppId').value;
            const diagnosis = document.getElementById('diagnosis').value;
            const medicine = document.getElementById('medicine').value;
            const dosage = document.getElementById('dosage').value;
            const amount = document.getElementById('amount').value;

            try {
                // Add Prescription
                await api.request('/doctor/prescription', 'POST', {
                    appointment_id: appId, diagnosis, medicine, dosage
                });
                
                // Add Bill
                await api.request('/doctor/bill', 'POST', {
                    appointment_id: appId, amount
                });

                alert("Prescription & Bill added! Appointment marked as Completed.");
                closeModal();
                loadTodayApps();
            } catch(e) {
                alert("Error: " + e.message);
            }
        });

        loadTodayApps();
    </script>
</body>
</html>
